<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Reinaldo Saraiva — Software, Cloud e Networks</title>
  <desc id="banner-description">Banner de apresentação de Reinaldo Saraiva. Código que conecta infraestrutura e produto. Perfil @reinaldosaraiva. Fundo azul-marinho com conexões de rede em azul e verde.</desc>
  <defs>
